<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo-change</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">todo-change</h1>
      <p class="app__tagline">A todo app built one spec at a time.</p>
    </header>

    <form class="composer" id="composer">
      <input class="composer__box" id="new-todo" type="text"
             placeholder="What needs doing?" aria-label="New todo"
             autocomplete="off" autofocus>
      <button class="composer__add" type="submit">Add</button>
    </form>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty">Nothing to do yet.</p>
  </main>

  <script type="module">
    import { mountApp } from './src/app.mjs';
    mountApp(document, localStorage);
  </script>
</body>
</html>
