<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div class="app__heading">
        <h1 class="app__title">Recipes</h1>
        <p class="app__tagline">A recipe book built one spec at a time.</p>
      </div>

      <div class="books" id="books">
        <button class="books__open" id="book-open" type="button"
                aria-haspopup="true" aria-expanded="false"></button>
        <div class="books__menu" id="book-menu" hidden></div>
      </div>
    </header>

    <form class="composer" id="composer">
      <input class="composer__box" id="new-recipe" type="text"
             placeholder="What are we cooking?" aria-label="New recipe"
             autocomplete="off" autofocus>
      <button class="composer__add" type="submit">Add</button>
    </form>

    <div class="finder">
      <input class="finder__box" id="find-recipe" type="search"
             placeholder="Find a recipe in any book"
             aria-label="Find a recipe in any book" autocomplete="off">
    </div>

    <ul class="contents" id="contents"></ul>
    <ul class="results" id="results" hidden></ul>
    <p class="empty" id="empty">No recipes in this book yet.</p>
  </main>

  <script type="module">
    import { mountApp } from './src/app.mjs';
    mountApp(document, localStorage);
  </script>
</body>
</html>
