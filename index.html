<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <!-- The whole app, drawn into here.

       This element used to hold the page's static shell — the masthead, the
       box, the search box, the colophon — with the app filling in the parts
       that moved. Since 0016 the drawing is Vue's and the shell is drawn with
       everything else, so it is described in one place (src/app.mjs) instead of
       two. Two copies of the same markup, one of them overwritten on load, is a
       drift nothing in the pipeline could have caught.

       There is still no build step and still only this page: what the browser
       runs is byte for byte what is in the repo, and the module below is the
       whole of the loading. See specs/setup/constraints.md. -->
  <main class="app"></main>

  <script type="module">
    import { mountApp } from './src/app.mjs';
    import { createModel } from './src/suggesting.mjs';
    // The model is handed in like the document and the storage, and is null in
    // every browser that has not got one — which is most of them.
    mountApp(document, localStorage, createModel(window));
  </script>
</body>
</html>
