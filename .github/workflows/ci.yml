name: CI

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time; never cancel a half-finished one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Default token is read-only once any permission is named; the report needs
    # to write a comment, and nothing else does.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Traceability
        # Every Rule in specs/features has a test; every behaviour test names a Rule.
        run: npm run trace

      - name: Tests and coverage gate
        # Fails under 95% lines, branches or functions across src/.
        run: npm test

      # Everything below is reporting. Both gates have already passed by here —
      # steps stop on first failure — so this only ever describes a green run.
      - name: Build the report
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/report.mjs | tee report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment it on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # One comment per PR, rewritten in place, so pushing does not bury the
        # thread in near-identical reports.
        run: |
          gh pr comment "$PR" --body-file report.md --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file report.md

  deploy:
    name: Deploy to Pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
