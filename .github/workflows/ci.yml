name: CI

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time; never cancel a half-finished one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Traceability
        # Every Rule in specs/features has a test; every behaviour test names a Rule.
        run: npm run trace

      - name: Tests and coverage gate
        # Fails under 95% lines, branches or functions across src/.
        run: npm test

  deploy:
    name: Deploy to Pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
